name: CI

on:
  push:
  pull_request:

env:
  # Pinned to match the local toolchain (anchor --version).
  ANCHOR_VERSION: "1.2.2"

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.89.0" # must match rust-toolchain.toml
          # Version comes from rust-toolchain.toml (1.89.0).
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.solana.com/stable/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Install Anchor CLI
        run: cargo install anchor-cli --version "$ANCHOR_VERSION"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Must run before the tests: they load target/deploy/*.so via include_bytes!.
      - name: Build program
        run: anchor build

      - name: Test
        run: cargo test --workspace
